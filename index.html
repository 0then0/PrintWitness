<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Local verification of required HTML text, table records and link destinations in PDF exports.">
    <script>
      // Apply explicit preferences before the first paint; CSS follows system changes.
      try {
        const theme = localStorage.getItem('printwitness.theme');
        document.documentElement.dataset.theme =
          theme === 'light' || theme === 'dark' ? theme : 'system';
      } catch { /* Follow the system when storage is unavailable. */ }
    </script>
    <title>PrintWitness · PDF content check</title>
    <link rel="icon" type="image/svg+xml" href="/icon.svg">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/ui/main.tsx"></script>
  </body>
</html>
