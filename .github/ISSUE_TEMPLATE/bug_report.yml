name: Bug report
description: Report reproducible behavior in the application, checking core or packaging.
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: |
        For vulnerabilities, follow [SECURITY.md](https://github.com/0then0/PrintWitness/blob/main/SECURITY.md#reporting-a-vulnerability).
        Use synthetic examples. Manifests, reports, screenshots and PDFs can contain private document text and URLs.
  - type: input
    id: version
    attributes:
      label: Version or commit
      description: Give the release version, or the full commit SHA for a source build.
      placeholder: v0.1.1
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS version, CPU architecture, standalone or source installation, browser; include Node.js version for source builds.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: List the steps, source selectors/readiness and a minimal synthetic HTML/PDF example when relevant. Include CSS needed to reproduce a layout issue.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior and evidence
      description: Include the finding status/reason, relevant logs and what the rendered page shows. A text-layer match alone does not prove visibility.
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy
      options:
        - label: I removed secrets, personal information and private document content from this report and its attachments.
          required: true
