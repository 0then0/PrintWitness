name: Feature request
description: Describe a concrete use case or improvement.
title: "[Feature]: "
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
      description: Describe who needs this and where the current workflow falls short. Use synthetic examples without private document content.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe the result you need, including how it should handle uncertain or unverifiable content when relevant.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives and constraints
      description: Mention workarounds, platform requirements and verification/privacy limits that matter to the use case.
