version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    # One slot per ecosystem keeps scheduled version-update PRs at two in total.
    # GitHub applies a separate limit to security updates; they remain enabled.
    open-pull-requests-limit: 1
    groups:
      npm-minor-patch:
        applies-to: version-updates
        update-types:
          - minor
          - patch
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    groups:
      actions-minor-patch:
        applies-to: version-updates
        update-types:
          - minor
          - patch
