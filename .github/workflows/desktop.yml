name: Desktop
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      [
        "src/**",
        "scripts/*desktop.ts",
        "scripts/desktop/**",
        "scripts/fixture-server.ts",
        "scripts/install-browser.ts",
        "fixtures/validation.html",
        "public/**",
        "index.html",
        "package*.json",
        "vite.config.ts",
        "tsconfig.json",
        ".npmrc",
        ".gitattributes",
        "LICENSE",
        "docs/desktop.md",
        ".github/workflows/desktop.yml",
      ]
  pull_request:
    paths:
      [
        "src/**",
        "scripts/*desktop.ts",
        "scripts/desktop/**",
        "scripts/fixture-server.ts",
        "scripts/install-browser.ts",
        "fixtures/validation.html",
        "public/**",
        "index.html",
        "package*.json",
        "vite.config.ts",
        "tsconfig.json",
        ".npmrc",
        ".gitattributes",
        "LICENSE",
        "docs/desktop.md",
        ".github/workflows/desktop.yml",
      ]
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-15-intel, windows-2025, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.22.1"
          cache: npm
      - run: npm ci
      - name: Install Linux browser system dependencies
        if: runner.os == 'Linux'
        run: npm run browsers -- --with-deps --only-shell
      - name: Install Windows installer tooling
        if: runner.os == 'Windows'
        run: choco install nsis --yes --no-progress
      - run: npm run desktop:build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: PrintWitness-${{ matrix.os }}
          path: |
            artifacts/desktop/*/bundles/
            artifacts/desktop/*/desktop.png
            artifacts/desktop/*/smoke test 日本語/user state/launcher.log
          if-no-files-found: ignore
          retention-days: 7
