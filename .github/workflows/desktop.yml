name: Desktop
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      [
        "src/**",
        "scripts/**",
        "public/**",
        "index.html",
        "package*.json",
        "vite.config.ts",
        "docs/desktop.md",
        ".github/workflows/desktop.yml",
      ]
  pull_request:
    paths:
      [
        "src/**",
        "scripts/**",
        "public/**",
        "index.html",
        "package*.json",
        "vite.config.ts",
        "docs/desktop.md",
        ".github/workflows/desktop.yml",
      ]
permissions:
  contents: read
jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-15-intel, windows-2025, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.22.1"
          cache: npm
      - run: npm ci
      - name: Install Linux browser system dependencies
        if: runner.os == 'Linux'
        run: npm run browsers -- --with-deps --only-shell
      - name: Install Windows installer tooling
        if: runner.os == 'Windows'
        run: choco install nsis --yes --no-progress
      - run: npm run desktop:build
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: PrintWitness-${{ matrix.os }}
          path: |
            artifacts/desktop/*/bundles/
            artifacts/desktop/*/desktop.png
            artifacts/desktop/*/smoke test 日本語/user state/launcher.log
          if-no-files-found: ignore
          retention-days: 7
