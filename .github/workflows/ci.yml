name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run browsers -- --with-deps
      - run: npm run check
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: validation-reports
          path: artifacts/
          retention-days: 7
          if-no-files-found: ignore
